# Verificação contínua e publicação do jogo no GitHub Pages (branch gh-pages).
name: CI e publicação

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build:pages
      - name: Navegador para os testes ponta a ponta
        run: npx --yes playwright@1.56.1 install --with-deps chromium
      - run: node --test tests/e2e/browser.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: dist-pages
          path: dist-pages

  publicar:
    needs: verificar
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist-pages
          path: dist-pages
      - name: Publicar o build verificado na branch gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: dist-pages
          enable_jekyll: false
          full_commit_message: "Publica build de main ${{ github.sha }}"
